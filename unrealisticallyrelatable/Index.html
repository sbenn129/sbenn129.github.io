/* ============================================================
   BASE
============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  background: #fff0f3;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: linear-gradient(160deg, #fff5f7 0%, #ffeef2 50%, #fff8f0 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 48px 16px 64px;
  color: var(--dark);
}

/* background subtle petal blobs */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .07;
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, var(--blush), transparent 70%);
  top: -120px; right: -120px;
}
body::after {
  width: 400px; height: 400px;
  background: radial-gradient(circle, var(--rose), transparent 70%);
  bottom: -100px; left: -100px;
}

/* ============================================================
   CARD
============================================================ */
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  animation: fadeUp .7s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   AVATAR
============================================================ */
.avatar-wrap {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  padding: 4px;
  background: linear-gradient(135deg, var(--blush), var(--mauve));
  box-shadow: 0 8px 32px rgba(196,125,142,.35);
  margin-bottom: 20px;
}
.avatar-wrap img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--cream);
}

/* ============================================================
   NAME & BIO
============================================================ */
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 600;
  letter-spacing: -.5px;
  color: var(--dark);
  text-align: center;
  margin-bottom: 4px;
}

.handle {
  font-size: .85rem;
  font-weight: 400;
  color: var(--mauve);
  letter-spacing: .5px;
  margin-bottom: 14px;
}

.bio {
  font-size: .92rem;
  line-height: 1.65;
  color: var(--mid);
  text-align: center;
  max-width: 320px;
  margin-bottom: 32px;
}

/* ============================================================
   DIVIDER
============================================================ */
.divider {
  width: 48px;
  height: 2px;
  background: linear-gradient(90deg, var(--blush), var(--mauve));
  border-radius: 99px;
  margin: 0 auto 32px;
}

/* ============================================================
   LINKS — edit text & href below in the HTML body
============================================================ */
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.link-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 24px;
  border-radius: 16px;
  background: var(--sand);
  border: 1.5px solid transparent;
  color: var(--dark);
  font-family: 'DM Sans', sans-serif;
  font-size: .95rem;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  box-shadow: 0 2px 12px rgba(196,125,142,.10);
}

.link-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 28px rgba(196,125,142,.28);
  border-color: var(--rose);
  background: #fff;
}

.link-btn .icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 22px;
  height: 22px;
}

.link-btn .label {
  text-align: left;
}

/* Primary CTA style */
.link-btn.primary {
  background: linear-gradient(135deg, var(--blush) 0%, var(--mauve) 100%);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 20px rgba(196,125,142,.45);
}
.link-btn.primary:hover {
  background: linear-gradient(135deg, var(--rose) 0%, #a55c70 100%);
  border-color: transparent;
}

/* ============================================================
   FOOTER
============================================================ */
.footer {
  margin-top: 40px;
  font-size: .75rem;
  color: var(--rose);
  letter-spacing: .5px;
  text-align: center;
}
