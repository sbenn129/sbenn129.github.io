<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bennett.ws</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
width: 100%;
height: 100%;
overflow: hidden;
background: #0a0a0a;
}

/* ── WATERMARK ── */
.watermark {
position: fixed;
inset: 0;
overflow: hidden;
z-index: 0;
opacity: 0.12;
user-select: none;
pointer-events: none;
display: flex;
flex-direction: column;
}

.watermark-row {
display: flex;
white-space: nowrap;
flex-shrink: 0;
}

.watermark-row span {
font-family: ‘Oswald’, sans-serif;
font-weight: 700;
font-size: 13px;
color: #f5a623;
letter-spacing: 0.08em;
padding-right: 1.2em;
line-height: 2;
}

/* ── CENTER STAGE ── */
.stage {
position: fixed;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
z-index: 1;
}

/* ── MONOGRAM ── */
.monogram {
width: 240px;
height: 240px;
border-radius: 50%;
background: #0a0a0a;
border: 2.5px solid #f5a623;
position: relative;
overflow: hidden;
box-shadow:
0 0 0 5px #0a0a0a,
0 0 0 7px #f5a623,
0 0 60px rgba(245, 166, 35, 0.25),
0 0 120px rgba(245, 166, 35, 0.1);
}

.monogram .b {
font-family: ‘Oswald’, sans-serif;
font-weight: 700;
font-size: 228px;
line-height: 1;
color: #f5a623;
position: absolute;
left: 50%;
transform: translateX(-50%);
top: 4px;
text-shadow:
0 0 40px rgba(245, 166, 35, 0.45),
0 0 80px rgba(245, 166, 35, 0.15);
user-select: none;
}
</style>

</head>
<body>

  <div class="watermark" id="watermark"></div>

  <div class="stage">
    <div class="monogram">
      <span class="b">b</span>
    </div>
  </div>

  <script>
    const wm = document.getElementById('watermark');
    const text = 'bennett.ws';
    const rowCount = 60;
    const repeatCount = 40;

    for (let i = 0; i < rowCount; i++) {
      const row = document.createElement('div');
      row.className = 'watermark-row';
      for (let j = 0; j < repeatCount; j++) {
        const span = document.createElement('span');
        span.textContent = text;
        row.appendChild(span);
      }
      wm.appendChild(row);
    }
  </script>

</body>
</html>
