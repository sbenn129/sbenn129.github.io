<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
width: 100%;
height: 100%;
overflow: hidden;
background: #0a0a0a;
}

.watermark {
position: fixed;
inset: 0;
overflow: hidden;
z-index: 0;
user-select: none;
pointer-events: none;
display: flex;
flex-direction: column;
}

.watermark-row {
display: flex;
white-space: nowrap;
flex-shrink: 0;
}

.watermark-row span {
font-family: ‘Oswald’, sans-serif;
font-weight: 700;
font-size: 14px;
color: #f5a623;
opacity: 0.22;
letter-spacing: 0.05em;
padding-right: 0.10em;
line-height: 1.6;
text-transform: uppercase;
}

.stage {
position: fixed;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
z-index: 1;
}

.monogram svg {
filter:
drop-shadow(0 0 24px rgba(245,166,35,0.55))
drop-shadow(0 0 60px rgba(245,166,35,0.2));
}
</style>

</head>

  </div>

  <script>
    const wm = document.getElementById('watermark');
    const text = 'BENNETT.WS';
    const rowCount = 50;
    const repeatCount = 20;
    for (let i = 0; i < rowCount; i++) {
      const row = document.createElement('div');
      row.className = 'watermark-row';
      for (let j = 0; j < repeatCount; j++) {
        const span = document.createElement('span');
        span.textContent = text;
        row.appendChild(span);
      }
      wm.appendChild(row);
    }
  </script>
