<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sean Bennett</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
color:white;
text-align:center;

/* BACKGROUND IMAGE */
background-image:url("bg.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
}

.container{
max-width:420px;
margin:auto;
padding:40px 20px;
}

/* profile section */

.profile-wrap{
position:relative;
display:inline-block;
margin-bottom:10px;
}

.profile{
width:140px;
height:140px;
border-radius:50%;
border:6px solid #ff9f2f;
object-fit:cover;
}

/* circular url text */

.circle-text{
position:absolute;
width:200px;
height:200px;
top:-30px;
left:-30px;
pointer-events:none;
}

.circle-text svg{
width:100%;
height:100%;
fill:#ff9f2f;
font-size:14px;
font-weight:bold;
letter-spacing:2px;
}

/* name */

h1{
margin:15px 0 5px;
font-size:38px;
}

/* subtitle */

.subtitle{
color:#ffd36c;
font-size:18px;
margin-bottom:35px;
}

/* social icons */

.socials{
display:flex;
justify-content:center;
gap:25px;
margin-bottom:35px;
}

.socials a{
font-size:48px;
text-decoration:none;
}

.instagram{color:#E1306C;}
.facebook{color:#1877F2;}
.youtube{color:#FF0000;}

/* buttons */

.button{
display:block;
background:#ff9f2f;
color:black;
padding:20px;
border-radius:18px;
margin:15px 0;
font-size:20px;
font-weight:bold;
text-decoration:none;
transition:.2s;
}

.button:hover{
transform:scale(1.03);
}

/* mobile tweaks */

@media (max-width:480px){

h1{
font-size:30px;
}

.button{
font-size:18px;
padding:18px;
}

.socials a{
font-size:40px;
}

}

</style>

</head>


<body>

<div class="container">

<div class="profile-wrap">

<img src="me.jpg" class="profile">

<div class="circle-text">

<svg viewBox="0 0 200 200">
<defs>

<path id="circle"
d="
M 100,100
m -80,0
a 80,80 0 1,1 160,0
a 80,80 0 1,1 -160,0
"/>

</defs>

<text>
<textPath xlink:href="#circle">
https://sean.bennett.ws
</textPath>
</text>

</svg>

</div>

</div>

<h1>Sean Bennett</h1>

<div class="subtitle">
Let's Connect! Check out my links below.
</div>

<div class="socials">

<a class="instagram" href="https://instagram.com/sbenn129">
<i class="fab fa-instagram"></i>
</a>

<a class="facebook" href="https://facebook.com/sbenn129">
<i class="fab fa-facebook"></i>
</a>

<a class="youtube" href="https://youtube.com/@sbenn129">
<i class="fab fa-youtube"></i>
</a>

</div>

<a class="button" href="https://linkedin.com/in/sbenn129">
Join my network on LinkedIn
</a>

<a class="button" href="https://drive.google.com/file/d/1Dq8e0tkhwaYlOlSrc4YnL1oREUvUWLkC/view?usp=drivesdk">
View my Résumé
</a>

<a class="button" href="mailto:sean@bennett.ws">
Send me an E-Mail
</a>

</div>

</body>
</html>
