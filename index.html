<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bennett.ws</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #1c1c1e;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .scene {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      animation: popIn 0.9s cubic-bezier(0.34,1.4,0.64,1) both;
    }
    #glowCanvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      filter: blur(28px);

}
.b-img {
  position: relative;
  z-index: 1;
  display: block;
  width: min(72vw, 340px);
  height: auto;
  filter: drop-shadow(0 0 18px rgba(45, 212, 191, 0.28))
          drop-shadow(0 0 6px rgba(0, 0, 0, 0.6));
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.85); }
  to   { opacity: 1; transform: scale(1); }
}

  </style>
</head>
<body>
  <div class="scene">
    <canvas id="glowCanvas"></canvas>
    <img id="bimg" class="b-img" src="logo.PNG" alt="bennett.ws" />
  </div>

  <script>
    const glowCanvas = document.getElementById('glowCanvas');
    const glowCtx    = glowCanvas.getContext('2d');
    const bimg       = document.getElementById('bimg');

    let angle = 0;
    let imgW = 0, imgH = 0, pad = 0;
    let cx = 0, cy = 0;

    function resize() {
      const rect = bimg.getBoundingClientRect();
      imgW = rect.width;
      imgH = rect.height;
      pad  = Math.max(imgW, imgH) * 1.1;
      const cw = Math.round(imgW + pad * 2);
      const ch = Math.round(imgH + pad * 2);
      glowCanvas.width  = cw;
      glowCanvas.height = ch;
      glowCanvas.style.width  = cw + 'px';
      glowCanvas.style.height = ch + 'px';
      cx = cw / 2;
      cy = ch / 2;
    }

    function draw() {
      if (!imgW) { requestAnimationFrame(draw); return; }

      // Clockwise rotation — positive increment
      angle += 0.04;

      const outerR = Math.max(imgW, imgH) * 0.90;
      const pullDist = outerR * 0.22;

      // Offset outer circle center in the current rotation direction
      const pullX = cx + Math.cos(angle) * pullDist;
      const pullY = cy + Math.sin(angle) * pullDist;

      // Slow decay for smooth trailing bloom
      glowCtx.fillStyle = 'rgba(28, 28, 30, 0.14)';
      glowCtx.fillRect(0, 0, glowCanvas.width, glowCanvas.height);

      const grad = glowCtx.createRadialGradient(cx, cy, 0, pullX, pullY, outerR);
      grad.addColorStop(0.00, 'rgba(255, 255, 255, 0.45)');
      grad.addColorStop(0.05, 'rgba(200, 255, 248, 0.38)');
      grad.addColorStop(0.13, 'rgba(45,  212, 191, 0.32)');
      grad.addColorStop(0.28, 'rgba(45,  212, 191, 0.18)');
      grad.addColorStop(0.44, 'rgba(13,  79,  71,  0.12)');
      grad.addColorStop(0.60, 'rgba(28,  28,  30,  0.07)');
      grad.addColorStop(0.78, 'rgba(10,  10,  12,  0.03)');
      grad.addColorStop(1.00, 'rgba(0,   0,   0,   0.00)');

      glowCtx.save();
      glowCtx.globalCompositeOperation = 'screen';
      glowCtx.beginPath();
      glowCtx.arc(cx, cy, outerR, 0, Math.PI * 2);
      glowCtx.fillStyle = grad;
      glowCtx.fill();
      glowCtx.restore();

      requestAnimationFrame(draw);
    }

    function init() {
      resize();
      glowCtx.fillStyle = '#1c1c1e';
      glowCtx.fillRect(0, 0, glowCanvas.width, glowCanvas.height);
      requestAnimationFrame(draw);
    }

    if (bimg.complete && bimg.naturalWidth) {
      setTimeout(init, 100);
    } else {
      bimg.addEventListener('load', () => setTimeout(init, 100));
    }
    window.addEventListener('resize', resize);
  </script>

</body>
</html>
