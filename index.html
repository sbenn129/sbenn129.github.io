<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bennett.ws</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
width: 100%;
height: 100%;
overflow: hidden;
background: #0a0a0a;
}

/* ── WATERMARK ── */
.watermark {
position: fixed;
inset: 0;
overflow: hidden;
z-index: 0;
user-select: none;
pointer-events: none;
display: flex;
flex-direction: column;
}

.watermark-row {
display: flex;
white-space: nowrap;
flex-shrink: 0;
}

.watermark-row span {
font-family: ‘Oswald’, sans-serif;
font-weight: 700;
font-size: 14px;
color: #f5a623;
opacity: 0.22;
letter-spacing: 0.05em;
padding-right: 0.8em;
line-height: 1.6;
}

/* ── CENTER STAGE ── */
.stage {
position: fixed;
inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 20px;
z-index: 1;
}

/* ── MONOGRAM — double ring ── */
.monogram {
width: 260px;
height: 260px;
border-radius: 50%;
background: radial-gradient(circle at center, #1a1200 0%, #0a0a0a 70%);
position: relative;
overflow: hidden;
box-shadow:
0 0 0 2px #f5a623,
0 0 0 8px #0a0a0a,
0 0 0 10px #f5a623,
0 0 60px rgba(245, 166, 35, 0.3),
0 0 120px rgba(245, 166, 35, 0.12);
border: 1.5px solid #f5a623;
}

.monogram .b {
font-family: ‘Oswald’, sans-serif;
font-weight: 700;
font-size: 260px;
line-height: 1;
color: #f5a623;
position: absolute;
left: 0;
right: 0;
text-align: center;
transform: scaleX(1.35);
top: -10px;
text-shadow:
0 0 50px rgba(245, 166, 35, 0.6),
0 0 100px rgba(245, 166, 35, 0.2);
user-select: none;
}

/* ── DOMAIN LABEL ── */
.domain {
font-family: ‘Oswald’, sans-serif;
font-weight: 700;
font-size: 22px;
color: #f5a623;
letter-spacing: 0.12em;
text-shadow: 0 0 20px rgba(245, 166, 35, 0.3);
}
</style>

</head>
<body>

  <div class="watermark" id="watermark"></div>

  <div class="stage">
    <div class="monogram">
      <span class="b">b</span>
    </div>
    <p class="domain">bennett.ws</p>
  </div>

  <script>
    const wm = document.getElementById('watermark');
    const text = 'bennett.ws';
    const rowCount = 50;
    const repeatCount = 20;

    for (let i = 0; i < rowCount; i++) {
      const row = document.createElement('div');
      row.className = 'watermark-row';
      for (let j = 0; j < repeatCount; j++) {
        const span = document.createElement('span');
        span.textContent = text;
        row.appendChild(span);
      }
      wm.appendChild(row);
    }
  </script>

</body>
</html>
