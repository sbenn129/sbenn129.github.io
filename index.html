<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENNETT.WS</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
width: 100%;
height: 100%;
overflow: hidden;
background: #0a0a0a;
}

.stage {
position: fixed;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
z-index: 1;
}

.monogram svg {
filter:
drop-shadow(0 0 24px rgba(245,166,35,0.55))
drop-shadow(0 0 60px rgba(245,166,35,0.2));
}
</style>

</head>
<body>

  <div class="stage">
    <div class="monogram">
      <svg width="260" height="300" viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bggrad" cx="50%" cy="60%" r="55%">
            <stop offset="0%" stop-color="#2a1800"/>
            <stop offset="100%" stop-color="#0a0a0a"/>
          </radialGradient>
          <clipPath id="bclip">
            <text
              x="130" y="285"
              font-family="Oswald, sans-serif"
              font-weight="700"
              font-size="300"
              text-anchor="middle"
          dominant-baseline="auto"
              transform="scale(1.15, 1)"
            >B</text>
          </clipPath>
        </defs>

    <!-- Dark glow background clipped to B -->
    <rect x="0" y="0" width="260" height="300"
      fill="url(#bggrad)"
      clip-path="url(#bclip)"/>

    <!-- Outer gold border -->
    <text
      x="130" y="285"
      font-family="Oswald, sans-serif"
      font-weight="700"
      font-size="300"
      text-anchor="middle"
      dominant-baseline="auto"
      transform="scale(1.15, 1)"
      fill="none"
      stroke="#f5a623"
      stroke-width="9"
      stroke-linejoin="round"
      paint-order="stroke"
    >B</text>

    <!-- Black gap -->
    <text
      x="130" y="285"
      font-family="Oswald, sans-serif"
      font-weight="700"
      font-size="300"
      text-anchor="middle"
      dominant-baseline="auto"
      transform="scale(1.15, 1)"
      fill="none"
      stroke="#0a0a0a"
      stroke-width="5"
      stroke-linejoin="round"
    >B</text>

    <!-- Thin inner gold outline -->
    <text
      x="130" y="285"
      font-family="Oswald, sans-serif"
      font-weight="700"
      font-size="300"
      text-anchor="middle"
      dominant-baseline="auto"
      transform="scale(1.15, 1)"
      fill="none"
      stroke="#f5a623"
      stroke-width="1.5"
      stroke-linejoin="round"
    >B</text>

    <!-- Gold filled B -->
    <text
      x="130" y="285"
      font-family="Oswald, sans-serif"
      font-weight="700"
      font-size="300"
      text-anchor="middle"
      dominant-baseline="auto"
      transform="scale(1.15, 1)"
      fill="#f5a623"
      opacity="0.92"
    >B</text>

    <!-- BENNETT.WS rotated 90° along the stem, in black -->
    <text
      font-family="Oswald, sans-serif"
      font-weight="700"
      font-size="38"
      fill="#000000"
      text-anchor="middle"
      dominant-baseline="auto"
      letter-spacing="3"
      transform="translate(68, 162) rotate(90)"
    >BENNETT.WS</text>

  </svg>
</div>

</body>
</html>
